name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          ls -la
          GRADLE_DIR=$(find. -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "Found gradle at: $GRADLE_DIR"
          cd $GRADLE_DIR
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ChaosCube-26.2-APK
          path: "**/app-debug.apk"
