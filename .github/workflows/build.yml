name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APK - Auto Fix All Errors
        run: |
          echo "--- 1. Checking all folders ---"
          ls -la
          echo "--- 2. Finding gradle file automatically ---"
          GRADLE_FILE=$(find. -name "settings.gradle*" | head -n 1)
          echo "Found: $GRADLE_FILE"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle nahi mila!"
            find. -type f | head -n 50
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Building in: $GRADLE_DIR"
          cd $GRADLE_DIR
          pwd
          ls -la

          echo "--- 3. Fixing permission if gradlew exists ---"
          if [ -f "./gradlew" ]; then
            chmod +x./gradlew
            echo "Using gradlew wrapper"
           ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew nahi hai, system gradle use kar raha hu"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChaosCube-26.2-APK
          path: |
            **/app-debug.apk
            **/app/build/outputs/apk/debug/*.apk
