name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          cd ChaosCube-Ultimate-Final
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChaosCube-26.2-APK
          path: ChaosCube-Ultimate-Final/app/build/outputs/apk/debug/app-debug.apk
