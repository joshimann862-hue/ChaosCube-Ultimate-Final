plugins {
    id 'com.android.application'
}
android {
    namespace 'com.chaoscube.launcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.chaoscube.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Ye line hi Java Engine hai
    implementation 'net.kdt.pojavlaunch:awt:1.0'
}
